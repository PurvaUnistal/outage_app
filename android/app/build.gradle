plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "unistal"
    compileSdk 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }
    sourceSets { main.java.srcDirs += 'src/main/kotlin' }

    flavorDimensions "app"

    productFlavors {
        prodAGCL {
            dimension "app"
            applicationIdSuffix ".agcloutage.app"
            resValue "string", "app_name", "AGCL Outage"
            manifestPlaceholders = [
                    appIcon: "@mipmap/agcl",
                    appIconRound: "@mipmap/agcl"
            ]
            versionCode 23
            versionName "1.0.2-agcl"
        }
        prodMGL {
            dimension "app"
            applicationIdSuffix ".mgloutage.app"
            resValue "string", "app_name", "MGL Outage"
            manifestPlaceholders = [
                    appIcon: "@mipmap/mgl",
                    appIconRound: "@mipmap/mgl"
            ]
            versionCode 01
            versionName "1.1.0-mgl"
        }
        prodPBGPL {
            dimension "app"
            applicationIdSuffix ".pbgploutage.app"
            resValue "string", "app_name", "PBGPL Outage"
            manifestPlaceholders = [
                    appIcon: "@mipmap/pbg_logo",
                    appIconRound: "@mipmap/pbg_logo"
            ]
            versionCode 03
            versionName "1.2.0-pbgpl"
        }
        prodIGL {
            dimension "app"
            applicationIdSuffix ".igloutage.app"
            resValue "string", "app_name", "IGL Outage"
            manifestPlaceholders = [
                    appIcon: "@mipmap/unistal_logo",
                    appIconRound: "@mipmap/unistal_logo"
            ]
            versionCode 01
            versionName "2.0.0-igl"
        }
    }

    defaultConfig {
        applicationId "unistal"
        minSdkVersion 24
        targetSdkVersion 36
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        exclude 'META-INF/proguard/androidx-annotations.pro'
        exclude 'META-INF/proguard/coroutines.pro'
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.12.0")
    implementation "com.google.firebase:firebase-crashlytics"
    implementation "com.google.firebase:firebase-analytics"
    implementation("com.google.android.play:app-update:2.1.0")
    implementation("com.google.android.play:app-update-ktx:2.1.0")
}
